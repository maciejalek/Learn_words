<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence picture gallery</title><style>body{font:15px system-ui;background:#f8f6ef;margin:24px}main{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}figure{margin:0;background:white;border-radius:12px;padding:10px;text-align:center}img{width:100%;max-height:170px}nav{margin:20px}</style><a href="./">← Play</a><h1>50 action sentences</h1><nav><a href="?page=0">1–20</a> · <a href="?page=1">21–40</a> · <a href="?page=2">41–50</a></nav><main></main><script type="module">import {preparePictures} from './pictures.js';const rows=await(await fetch('sentences.json')).json();await preparePictures(rows);const page=Math.max(0,Math.min(2,Number(new URL(location).searchParams.get('page'))||0));for(const s of rows.slice(page*20,page*20+20)){const f=document.createElement('figure');const i=document.createElement('img');i.src=s.image;i.alt=s.word;const c=document.createElement('figcaption');c.textContent=s.word;f.append(i,c);document.querySelector('main').append(f);}</script></html>

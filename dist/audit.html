<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picture dictionary · Little Objects</title><style>body{margin:0;background:#f7f6f0;color:#263f36;font:15px system-ui}main{max-width:1320px;padding:22px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:24px;margin:0}p{color:#718078;font-size:12px}a{color:inherit}#grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.card{text-align:center;background:#fffefa;border:1px solid #e0e4d7;border-radius:17px;padding:8px}.card img{width:110px;height:118px;max-width:100%;object-fit:contain}.card strong{display:block;font-weight:500}.card small{display:block;color:#718078;font-size:11px;margin-top:3px}footer{font-size:11px;margin-top:18px;color:#718078}@media(max-width:700px){#grid{grid-template-columns:repeat(4,1fr)}.card img{height:85px}main{padding:15px}h1{font-size:20px}}@media(max-width:400px){#grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main><header><div><h1>Every picture, checked.</h1><p>32 everyday objects · one clear meaning at a time</p></div><a href="./">← Back to play</a></header><div id="grid" role="list"><p>Getting pictures ready…</p></div><footer>Artwork: OpenMoji contributors · CC BY-SA 4.0 · Fork, plate and bowl simplified. Cup: Little Objects original. <a href="credits.html">Credits & licenses</a></footer></main><script type="module">import {preparePictures} from './pictures.js';const grid=document.querySelector('#grid');try{const words=await(await fetch('words.json',{cache:'no-cache'})).json();const keep=await preparePictures(words);grid.replaceChildren(...words.map(w=>{const card=document.createElement('div');card.className='card';card.setAttribute('role','listitem');const img=new Image();img.src=w.image;img.alt=w.word;const title=document.createElement('strong');title.textContent=w.word;const pl=document.createElement('small');pl.textContent=w.meaning_pl;card.append(img,title,pl);return card;}));}catch{grid.textContent='Pictures could not load. Please check your connection and reload.';}</script></body></html>

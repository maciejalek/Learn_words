<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson vocabulary · Little Objects</title><link rel="stylesheet" href="style.css?v=20261026-9"><style>.lesson-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.lesson-item{border:1px solid var(--line);background:#fffdf7;border-radius:16px;padding:12px;text-align:center}.lesson-item img{width:100%;height:130px;object-fit:contain}.lesson-item h2{font-size:16px;margin:10px 0}.lesson-item p{font-size:12px;line-height:1.5}.gallery-pages a{margin-right:14px}@media(max-width:600px){.lesson-gallery{grid-template-columns:repeat(2,1fr)}}@media print{nav,.gallery-pages{display:none}}</style><main class="shell"><a href="./">← Back to play</a><form id="lookup" class="controls"><label for="code">Lesson code</label><input id="code" inputmode="numeric" pattern="[0-9]{1,8}" required style="max-width:170px"><button class="primary">View lesson</button></form><h1 id="title">Lesson vocabulary</h1><p class="sub" id="note"></p><p id="status" role="status"></p><nav class="gallery-pages" id="pages"></nav><section class="lesson-gallery" id="gallery"></section><p><a href="credits.html">Picture credits and licenses</a></p></main><script type="module">
import {findTopic} from './topics.js?v=20261026-9';import {preparePictures} from './pictures.js?v=20261026-9';
const params=new URL(location).searchParams;document.querySelector('#lookup').onsubmit=e=>{e.preventDefault();location.href='lesson.html?code='+encodeURIComponent(document.querySelector('#code').value);};
const topics=await(await fetch('topics.json',{cache:'no-cache'})).json();const topic=findTopic(topics,params.get('code'));
if(!topic){document.querySelector('#status').textContent='Enter the code your teacher gave you.';}else{
 document.title=topic.title+' · Lesson '+topic.code;document.querySelector('#code').value=topic.code;document.querySelector('#title').textContent=topic.title+' · '+topic.entries.length+' entries';document.querySelector('#note').textContent=topic.note;document.querySelector('#status').textContent='Loading lesson pictures…';await preparePictures(topic.entries,()=>{},{bundlePath:topic.bundle,cacheName:'little-objects-lesson-'+topic.code});document.querySelector('#status').textContent='';
 const page=Math.max(0,Math.min(3,Number(params.get('page'))||0));const nav=document.querySelector('#pages');for(let i=0;i<4;i++){const a=document.createElement('a');a.href='lesson.html?code='+topic.code+'&page='+i;a.textContent=(i*16+1)+'–'+(i*16+16);nav.append(a);}const download=document.createElement('a');download.href='lessons/'+topic.code+'.csv';download.download=topic.code+'.csv';download.textContent='Download all 64 (CSV)';nav.append(download);
 for(const entry of topic.entries.slice(page*16,page*16+16)){const card=document.createElement('article');card.className='lesson-item';const img=document.createElement('img');img.src=entry.image;img.alt=entry.word;const title=document.createElement('h2');title.textContent=entry.word;const pl=document.createElement('p');pl.textContent=entry.meaning_pl;const gloss=document.createElement('p');gloss.textContent=entry.gloss;card.append(img,title,pl,gloss);document.querySelector('#gallery').append(card);}
}
</script></html>
